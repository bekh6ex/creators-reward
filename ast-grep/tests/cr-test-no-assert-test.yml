id: cr-test-no-assert
valid:
  - |
    fn production() {
        assert!(true);
    }
  - |
    #[cfg(test)]
    mod tests {
        #[gtest]
        #[rstest]
        fn ok() {
            expect_that!(1, eq(1));
        }
    }
invalid:
  - |
    #[cfg(test)]
    mod tests {
        #[test]
        fn bad() {
            assert!(true);
        }
    }
  - |
    #[cfg(test)]
    mod tests {
        #[rstest]
        fn bad() {
            assert_eq!(1, 1);
        }
    }
  - |
    #[cfg(test)]
    mod tests {
        #[tokio::test]
        async fn bad() {
            assert_ne!(1, 2);
        }
    }
  - |
    #[cfg(test)]
    mod tests {
        fn helper() {
            debug_assert!(true);
        }
    }
